# Configuration for the FEWS farm model.
#
# Every number here was previously written out in each of the eleven stage-2 R
# reports and both stage-1 notebooks, in some cases with a different value. It
# lives here so a scenario change is a config edit, not a code edit (Part 1,
# invariant 2). Provenance for each figure is kept as a comment, because a
# parameter whose source is lost is a parameter nobody may revise.

# --- unit conversions ------------------------------------------------------
conversions:
  cm2_per_ha: 100000000        # 100,000,000 cm^2 = 1 ha
  cm3_per_gal: 3785.41
  gal_per_acre_ft: 325851
  acre_per_ha: 2.47105
  cm_per_ft: 30.48
  cm_per_in: 2.54
  hours_per_month: 720
  growing_season_months: 9

# --- farm and market -------------------------------------------------------
farm:
  hectares: 200                # average Texas farm, 411 acres rounded up
                               # texasagriculture.gov/About/TexasAgStats.aspx
  crop_price_per_tonne: 200    # indexmundi.com/commodities/?commodity=wheat

# --- water -----------------------------------------------------------------
water:
  # $2/gal of alternative-water capacity, spread over 365 days, converted to
  # $/cm-depth over the whole farm: 2 / 365 / cm3_per_gal * cm2_per_ha * hectares
  alt_capacity_dollars_per_gal_day: 2.0
  days_per_year: 365
  # 6.25 kWh/kGal of alternative water, converted to kWh per cm of depth
  alt_kwh_per_kgal: 6.25
  # $7 per acre-inch of irrigation water
  irrigation_dollars_per_acre_in: 7.0
  # 1 kWh/kGal of irrigation water
  irrigation_kwh_per_kgal: 1.0
  # 1.5 acre-ft/acre/yr, halved for the growing season, as a fraction of a foot
  # nass.usda.gov/Publications/Highlights/2019/2017Census_Irrigation_and_WaterManagement.pdf
  irrigation_limit_ft: 0.25

# --- electricity -----------------------------------------------------------
electricity:
  alt_capacity_dollars_per_kw: 1500   # Fu, Feldman & Margolis (2018), NREL
  utility_dollars_per_kwh: 0.08
  solar_capacity_factor: 0.30         # pv-magazine-usa.com, Texas

# --- crop yield ------------------------------------------------------------
# Dinar et al. (1991), "Production functions relating crop yield, water quality
# and quantity, soil salinity and drainage volume". Yield (tonne/ha) as a
# concave quadratic in water depth w (cm), at fixed salinities:
#
#   y(w) = a0 + a1*w + a2*w^2
#
# where the salinity terms fold into a0 and a1. The coefficients below are the
# raw ones; src/fews_stochopt/model.py folds them, and tests/test_invariants.py
# checks the folding against the expression as written in the notebooks.
yield_function:
  soil_salinity_ds_per_m: 2       # salt_conc
  water_salinity_ds_per_m: 1      # salt_conc_water
  intercept: -3.350
  water: 0.2064
  water_squared: -0.0014
  water_salinity: 3.555
  water_salinity_squared: 2.326
  soil_salinity: -2.031
  soil_salinity_squared: 0.823
  water_x_water_salinity: -0.071
  water_x_soil_salinity: 0.033
  water_salinity_x_soil_salinity: -2.754

# --- horizon ---------------------------------------------------------------
horizon:
  years: 25
  runs: 4000                   # Monte Carlo draws per site, fixed by the
                               # committed precipitation files

# --- weather states --------------------------------------------------------
# The five Markov states, in cm of growing-season precipitation. Generated by
# stage2-r/FM {EP,DML} MC.Rmd as  inches * cm_per_in * rainfall_days_fraction.
weather_states:
  rainfall_days_fraction: 0.70
  inches: {w1: 5, w2: 15, w3: 30, w4: 45, w5: 60}
  # -> 8.89, 26.67, 53.34, 80.01, 106.68 cm

# --- sites -----------------------------------------------------------------
# The two case-study climate regimes. `climate_blocks` records how the shipped
# precipitation file is laid out: FM {EP,DML} MC.Rmd builds precips_c0 by
# concatenating the four per-climate draws and then renumbering the runs 1..4000,
# so the climate a run belongs to is decided by its position, and the *sizes* of
# those blocks are how each site's climate probabilities are encoded. This is
# the fact that makes the per-climate inputs recoverable from the committed
# c0 file, and it is the reason no additional input is needed. Verified against
# run counts in stage2-r/FM MI {EP,DML} All Climates.Rmd.
sites:
  EP:
    label: Equally Probable
    precipitation_file: stage1-python/precips_c0_EP.csv
    climate_blocks:            # [first_run, last_run] inclusive, climates 1..4
      - [1, 1000]
      - [1001, 2000]
      - [2001, 3000]
      - [3001, 4000]
    climate_probabilities: [0.25, 0.25, 0.25, 0.25]
    # The deterministic "expected value" precipitation path, one entry per year,
    # taken verbatim from rain_dict1 in FarmModelStoch_EV_loop.ipynb. Note the
    # final value is 107, not the 106.68 the Markov state w5 actually carries:
    # a rounding in the original that is reproduced here because it is what
    # produced the published table. See docs/reproduction-notes.md.
    expected_value_rain:
      [8.89, 8.89, 8.89,
       26.67, 26.67, 26.67, 26.67, 26.67, 26.67,
       53.34, 53.34, 53.34, 53.34, 53.34, 53.34, 53.34, 53.34,
       80.01, 80.01, 80.01, 80.01, 80.01,
       107, 107, 107]
  DML:
    label: Dry Most Likely
    precipitation_file: stage1-python/precips_c0_DML.csv
    climate_blocks:
      - [1, 2400]
      - [2401, 3400]
      - [3401, 3800]
      - [3801, 4000]
    climate_probabilities: [0.60, 0.25, 0.10, 0.05]
    # rain_dict2 in FarmModelStoch_EV_loop.ipynb
    expected_value_rain:
      [8.89, 8.89, 8.89, 8.89,
       26.67, 26.67, 26.67, 26.67, 26.67, 26.67, 26.67, 26.67, 26.67, 26.67,
       53.34, 53.34, 53.34, 53.34, 53.34, 53.34, 53.34, 53.34,
       80.01, 80.01,
       107]

# --- solver ----------------------------------------------------------------
# Gurobi is deterministic given identical parameters and version, so `seed` does
# not change the answer; it is recorded because the model is reported as
# stochastic and a reader is entitled to know the randomness is in the input
# file rather than in the solve. See docs/reproduction-notes.md.
#
# `parameter_ladder` is not tuning for speed. On default settings the barrier
# stalls short of its optimality tolerance on most single-run solves and returns
# status 13, SUBOPTIMAL -- measured at 25 of 40 sampled runs. The original code
# never read the status, so the published numbers were computed partly from
# solutions Gurobi declined to certify. `model.py` refuses anything that is not
# status OPTIMAL and works down this ladder until one rung certifies:
#
#   rung 1 (BarHomogeneous + NumericFocus)  197 of 200 sampled runs
#   rung 2 (+ aggressive scaling)           the remaining 3
#
# Where two rungs both certify, they agree to about 1e-3 on a $2.6M objective.
# See docs/reproduction-notes.md.
solver:
  name: gurobi
  seed: 0
  output_flag: 0
  threads: 0                   # 0 = let Gurobi choose
  parameter_ladder:
    - {BarHomogeneous: 1, NumericFocus: 3}
    - {BarHomogeneous: 1, NumericFocus: 3, ScaleFlag: 2}
    - {NumericFocus: 3}

# --- tolerances ------------------------------------------------------------
# ONE definition, imported by both scripts/run_all.py and tests/. The standard's
# Part 4 corollary is explicit that a threshold written twice is where a
# correction fails to reach. Every figure below is a MEASUREMENT, recorded in
# docs/reproduction-notes.md with the run that produced it, not a value chosen
# to make a check pass.
#
# A tolerance has to sit between the noise and the effect. The noise here is
# under a dollar; the effect a check exists to catch -- a mis-specified scenario,
# a climate block off by one, a sign error -- is thousands. There is three orders
# of magnitude between them, and every figure below sits in the gap.
tolerances:
  # Largest observed difference between a scenario profit mean reproduced here
  # and the published one: $0.75, over seven of the eight site-scenario
  # combinations. The eighth is the expected-value case below.
  scenario_mean_abs_dollars: 2.0
  # A value-of-information figure is a difference of two scenario means. Their
  # errors turn out to be correlated -- same solver, same instance -- so this is
  # no worse in practice than a single mean: $0.81 observed, on EVPI.
  value_of_information_abs_dollars: 2.0
  # The one deviation, and it is a property of the INSTANCE rather than of this
  # implementation. The expected-value first stage solves a deterministic problem
  # whose objective is flat in the capacities: at Dry Most Likely, capacities
  # 0.08% apart differ by $0.43 there and earn $20.35 apart over the 4,000
  # realised runs. So a freely re-solved expected-value scenario may land that far
  # from the published one without anything being wrong.
  #
  # A wide bound is only honest next to a narrow one. Solved at the capacities
  # the published run used -- reference/published_first_stage.csv -- that same
  # scenario reproduces to $0.36, and tests/test_reproduces_paper.py asserts THAT
  # at value_of_information_abs_dollars. The narrow check is what stops this wide
  # one from hiding a defect in the second stage.
  expected_value_first_stage_sensitivity_dollars: 25.0
  # The identity EVPI = EVKW + EVKC is arithmetic, not a solve, and holds to
  # floating point.
  identity_rel: 1.0e-12
